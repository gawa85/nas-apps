# HolyArrs (series, películas y música) + SABnzbd (descargas por Usenet), en el TrueNAS.
#
# Todo vive en el dataset /mnt/HomePool/holyarr:
#   config/holyarrs   base y ajustes de HolyArrs
#   config/sabnzbd    ajustes de SABnzbd
#   data/             lo que ven los dos, en la MISMA ruta (/data): así pasar de descargas a la
#     downloads/      biblioteca es instantáneo (un movimiento, no una copia)
#     movies/  tv/  music/
#
# Los puertos van en modo host: escuchan solo en el NAS (con el modo de siempre de Swarm, quedarían
# abiertos en todos los nodos, también en la IP pública del VPS). Se entra por Tailscale.
# Los dos hablan entre sí por la red del stack: HolyArrs llega a SABnzbd como http://sabnzbd:8080.
#
# Monta carpetas del NAS: en stacks.yml este stack va con `trusted: true`.

x-nas: &nas
  placement:
    constraints: [node.labels.ubicacion == nas]
  restart_policy: {condition: any}

services:
  holyarrs:
    image: holyarrs/holyarrs:1.2.0          # versión fija; para seguir las nuevas: "Seguir imagen"
    environment:
      PUID: "568"                           # el usuario "apps" de TrueNAS (confirmalo con: id apps)
      PGID: "568"
      TZ: America/Argentina/Buenos_Aires
      UMASK: "002"
    volumes:
      - /mnt/HomePool/holyarr/config/holyarrs:/config
      - /mnt/HomePool/holyarr/data:/data
    ports:
      - {target: 6262, published: 6262, mode: host}
    deploy: *nas

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    environment:
      PUID: "568"
      PGID: "568"
      TZ: America/Argentina/Buenos_Aires
      UMASK: "002"
    volumes:
      - /mnt/HomePool/holyarr/config/sabnzbd:/config
      - /mnt/HomePool/holyarr/data:/data
    ports:
      - {target: 8080, published: 8080, mode: host}
    deploy: *nas
